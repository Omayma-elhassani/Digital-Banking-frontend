<div class="container mt-3">
  <div class="card">
    <div class="card-header"><h4>Liste des Clients</h4></div>
    <div class="card-body">
      <form [formGroup]="searchFormGroup" (ngSubmit)="handleSearchClients()">
        <div class="row g-2 mb-3">
          <div class="col-md-9">
            <input type="text" class="form-control" formControlName="keyword" placeholder="Rechercher un client...">
          </div>
          <div class="col-md-3 d-grid">
            <button class="btn btn-info text-white">Rechercher</button>
          </div>
        </div>
      </form>

      <ng-container *ngIf="clients | async as list; else loading">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
            <tr><th>ID</th><th>Nom</th><th>Email</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of list">
              <td>{{ c.id }}</td>
              <td>{{ c.nom }}</td>
              <td>{{ c.email }}</td>
              <td>
                <button class="btn btn-sm btn-primary me-1" (click)="handleClientContrats(c)">Contrats</button>
                <button class="btn btn-sm btn-danger" (click)="handleDeleteClient(c)">Supprimer</button>
              </td>
            </tr>
            <tr *ngIf="list.length === 0">
              <td colspan="4" class="text-center text-muted">Aucun client trouvé</td>
            </tr>
          </tbody>
        </table>
      </ng-container>
      <ng-template #loading><div class="text-center"><div class="spinner-border"></div></div></ng-template>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
    </div>
  </div>
</div>
